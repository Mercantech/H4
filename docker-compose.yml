# Dokploy: docker compose up -d --build
# Ingen host-ports. Ren Traefik (PathPrefix til API).
services:
  api:
    build:
      context: ./Backend
      dockerfile: API/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      CORS_ORIGINS: ${CORS_ORIGINS:-https://h4.mercantec.tech}
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.h4-api.rule=Host(`${APP_DOMAIN:-h4.mercantec.tech}`) && PathPrefix(`/api`)
      - traefik.http.routers.h4-api.entrypoints=web
      - traefik.http.routers.h4-api.priority=100
      - traefik.http.routers.h4-api.service=h4-api
      - traefik.http.services.h4-api.loadbalancer.server.port=8080

  web:
    build:
      context: ./flutter_app
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: "1"
        CACHEBUST: "${CACHEBUST:-1}"
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.h4-web.rule=Host(`${APP_DOMAIN:-h4.mercantec.tech}`)
      - traefik.http.routers.h4-web.entrypoints=web
      - traefik.http.routers.h4-web.priority=1
      - traefik.http.routers.h4-web.service=h4-web
      - traefik.http.services.h4-web.loadbalancer.server.port=80
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  default:
    name: dokploy-network
    external: true
